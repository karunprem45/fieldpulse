name: pipeline
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly run on fresh synthetic data
jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m fieldpulse.pipeline --generate 10
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/latest.json
